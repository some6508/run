mixed-port: 7890
ipv6: false
mode: rule
log-level: error
allow-lan: true
bind-address: '*'
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 60
external-controller: 0.0.0.0:9090
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist-no-fonts.zip
external-ui: ui
geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://cdn.jsdelivr.net/gh/appshubcc/bett-rules@release/geoip.dat
  geosite: https://cdn.jsdelivr.net/gh/appshubcc/bett-rules@release/geosite.dat
  mmdb: https://cdn.jsdelivr.net/gh/appshubcc/bett-rules@release/geoip.metadb
  asn: https://cdn.jsdelivr.net/gh/appshubcc/bett-rules@release/GeoLite2-ASN.mmdb

profile:
  store-selected: false
  store-fake-ip: true

ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 60

tun:
  enable: true
  stack: gvisor
  dns-hijack: [any:53, tcp://any:53]
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true

hosts:
  +.mcdn.bilivideo.com: 0.0.0.0
  +.mcdn.bilivideo.cn: 0.0.0.0
  +.edge.mountaintoys.cn: 0.0.0.0
  +.h2.smtcdns.net: 0.0.0.0

sub_dns:
  dns_ip: &dns_ip [223.5.5.5#DIRECT, 119.29.29.29#DIRECT]
  dns_Direct: &dns_Direct [https://doh.pub/dns-query#DIRECT, https://dns.alidns.com/dns-query#DIRECT]
  dns_Proxy: &dns_Proxy [https://dns.google/dns-query#🚀 节点选择, https://cloudflare-dns.com/dns-query#🚀 节点选择, https://dns11.quad9.net/dns-query#🚀 节点选择]

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  use-hosts: true
  cache-algorithm: arc
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['+.lan', '+.local', 'localhost.ptlogin2.qq.com', '+.msftconnecttest.com', '+.msftncsi.com', '+.ntp.org', '+.xboxlive.com', '+.playstation.net', '+.xbox.com', 'xbox.ipv6.microsoft.com', '+.srv.nintendo.net', 'time.windows.com', 'time.apple.com', '+.stun.*', '+.stun.*.*', '+.stun.*.*.*', '+.stun.*.*.*.*']
  default-nameserver: *dns_ip
  nameserver: *dns_Proxy
  proxy-server-nameserver: *dns_Direct
  direct-nameserver: *dns_Direct
