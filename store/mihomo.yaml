mixed-port: 7890
ipv6: false
mode: rule
log-level: error
allow-lan: true
bind-address: '*'
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 60
external-controller: 0.0.0.0:9090
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist-no-fonts.zip
external-ui: ui
secret: ccaeo
geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://cdn.jsdmirror.com/gh/appshubcc/bett-rules@release/geoip.dat
  geosite: https://cdn.jsdmirror.com/gh/appshubcc/bett-rules@release/geosite.dat
  mmdb: https://cdn.jsdmirror.com/gh/appshubcc/bett-rules@release/geoip.metadb
  asn: https://cdn.jsdmirror.com/gh/appshubcc/bett-rules@release/GeoLite2-ASN.mmdb

profile:
  store-selected: false
  store-fake-ip: true

ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 60

tun:
  enable: true
  stack: mips
  dns-mode: hijack
  dns-hijack: [any:53, tcp://any:53]
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  congestion-controller: bbr3

hosts:
  services.googleapis.cn: services.googleapis.com
  +.mcdn.bilivideo.com: 0.0.0.0
  +.mcdn.bilivideo.cn: 0.0.0.0
  +.edge.mountaintoys.cn: 0.0.0.0
  +.h2.smtcdns.net: 0.0.0.0

sub_dns:
  dns_ip: &dns_ip [223.5.5.5#🎯 直连访问, 119.29.29.29#🎯 直连访问, 114.114.114.114#🎯 直连访问]
  dns_Direct: &dns_Direct [https://doh.pub/dns-query#🎯 直连访问, https://dns.alidns.com/dns-query#🎯 直连访问]
  dns_Proxy: &dns_Proxy [https://dns.google/dns-query#🚀 节点选择, https://cloudflare-dns.com/dns-query#🚀 节点选择, https://dns11.quad9.net/dns-query#🚀 节点选择]

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  use-hosts: true
  cache-algorithm: arc
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: [rule-set:private, rule-set:fakeip-filter, rule-set:googlefcm]
  default-nameserver: *dns_ip
  direct-nameserver: *dns_Direct
  proxy-server-nameserver: *dns_Direct
  nameserver: *dns_Proxy
  nameserver-policy:
    rule-set:private: system
    rule-set:adblockmihomo: rcode://name_error

sub_rule:
  RuleSet_ipcidr_mrs: &RuleSet_ipcidr_mrs {type: http, interval: 86400, behavior: ipcidr, format: mrs, proxy: 🎯 直连访问}
  RuleSet_domain_mrs: &RuleSet_domain_mrs {type: http, interval: 86400, behavior: domain, format: mrs, proxy: 🎯 直连访问}

sub_filter:
  FilterHK: &FilterHK '(?i)(港|hk|hong\s*kong|🇭🇰)'
  FilterTW: &FilterTW '(?i)(台|新北|彰化|tw|taiwan|🇹🇼)'
  FilterJP: &FilterJP '(?i)(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|jp|japan|tokyo|🇯🇵)'
  FilterUS: &FilterUS '(?i)(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|us|united\s*states|🇺🇸)'
  FilterSG: &FilterSG '(?i)(新加坡|坡|狮城|sg|singapore|🇸🇬)'
  FilterUN: &FilterUN '(?i)(🇨🇳|🇭🇰|🇹🇼|🇯🇵|🇺🇸|🇸🇬|港|hk|hong\s*kong|台|新北|彰化|tw|taiwan|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|jp|japan|tokyo|新加坡|坡|狮城|sg|singapore|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|us|united\s*states)'

sub_group:
  t: &t {url: 'https://www.apple.com/library/test/success.html', interval: 600, tolerance: 50, timeout: 5000, max-failed-times: 3}
  p: &p {<<: *t, exclude-type: DIRECT|DNS, empty-fallback: REJECT, include-all: true, lazy: true, hidden: true}
  UrlTest: &UrlTest {type: url-test, <<: *p}
  FallBack: &FallBack {type: fallback, <<: *p}
  LoadBalance: &LoadBalance {type: load-balance, strategy: sticky-sessions, <<: *p}
  Select: &Select {type: select, include-all: true, exclude-type: DIRECT|DNS, proxies: [
    🚀 节点选择, ♻️ 自动选择, ☁️ 故障转移, 🔮 负载均衡, 🖲️ 手动选择,
    🇭🇰 香港自动, 🇹🇼 台湾自动, 🇯🇵 日本自动, 🇺🇸 美国自动, 🇸🇬 新加坡自动, 🇺🇳 联合国自动,
    🇭🇰 香港故障, 🇹🇼 台湾故障, 🇯🇵 日本故障, 🇺🇸 美国故障, 🇸🇬 新加坡故障, 🇺🇳 联合国故障,
    🇭🇰 香港负载, 🇹🇼 台湾负载, 🇯🇵 日本负载, 🇺🇸 美国负载, 🇸🇬 新加坡负载, 🇺🇳 联合国负载,
    🎯 直连访问, 🚫 拦截访问]}

proxy-groups:
  - name: 🚀 节点选择
    type: select
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/All.svg
    include-all: true
    exclude-type: DIRECT|DNS
    proxies: [
      ♻️ 自动选择, ☁️ 故障转移, 🔮 负载均衡,
      🇭🇰 香港自动, 🇹🇼 台湾自动, 🇯🇵 日本自动, 🇺🇸 美国自动, 🇸🇬 新加坡自动, 🇺🇳 联合国自动,
      🇭🇰 香港故障, 🇹🇼 台湾故障, 🇯🇵 日本故障, 🇺🇸 美国故障, 🇸🇬 新加坡故障, 🇺🇳 联合国故障,
      🇭🇰 香港负载, 🇹🇼 台湾负载, 🇯🇵 日本负载, 🇺🇸 美国负载, 🇸🇬 新加坡负载, 🇺🇳 联合国负载,
      🖲️ 手动选择, 🎯 直连访问
    ]

  - name: ♻️ 自动选择
    <<: *UrlTest
    hidden: false
    icon: https://cdn.jsdmirror.com/gh/some6508/run@master/icon/UrlTest.svg

  - name: ☁️ 故障转移
    <<: *FallBack
    hidden: false
    icon: https://cdn.jsdmirror.com/gh/some6508/run@master/icon/FallBack.svg

  - name: 🖲️ 手动选择
    icon: https://cdn.jsdmirror.com/gh/some6508/run@master/icon/Select.svg
    type: select
    include-all: true
    exclude-type: DIRECT|DNS
    default-selected: 🎯 直连访问
    proxies: [🎯 直连访问]

  - name: 🔮 负载均衡
    <<: *LoadBalance
    hidden: false
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/Meter.svg

  - name: 🎯 直连访问
    <<: *t
    type: url-test
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/Update.svg
    url: https://connectivitycheck.platform.hicloud.com/generate_204
    proxies: [DIRECT]

  - name: 🇬 Google
    <<: *Select
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/Google.svg

  - name: 🪟 Microsoft
    <<: *Select
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/Microsoft.svg

  - name: 🤖 OpenAi
    <<: *Select
    default-selected: 🇺🇸 美国自动
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/Ai.svg

  - name: ✈️ Telegram
    <<: *Select
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/Telegram.svg

  - name: 🐦 Twitter
    <<: *Select
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/Twitter.svg

  - name: 🎵 TikTok
    <<: *Select
    default-selected: 🇺🇸 美国自动
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/TikTok.svg

  - name: 🍎 Apple
    <<: *Select
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/Apple.svg

  - name: 🚫 拦截访问
    type: select
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/No-ads-all.svg
    proxies: [REJECT, 🎯 直连访问, 🚀 节点选择]

  - name: 🐟 漏网之鱼
    <<: *Select
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/HBASE-copy.svg

  - name: 🇭🇰 香港自动
    <<: *UrlTest
    filter: *FilterHK
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/HK.svg

  - name: 🇹🇼 台湾自动
    <<: *UrlTest
    filter: *FilterTW
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/CN.svg

  - name: 🇯🇵 日本自动
    <<: *UrlTest
    filter: *FilterJP
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/JP.svg

  - name: 🇺🇸 美国自动
    <<: *UrlTest
    filter: *FilterUS
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/US.svg

  - name: 🇸🇬 新加坡自动
    <<: *UrlTest
    filter: *FilterSG
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/Singapore.svg

  - name: 🇺🇳 联合国自动
    <<: *UrlTest
    exclude-filter: *FilterUN
    icon: https://cdn.jsdmirror.com/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/flags/un.svg

  - name: 🇭🇰 香港故障
    <<: *FallBack
    filter: *FilterHK
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/HK.svg

  - name: 🇹🇼 台湾故障
    <<: *FallBack
    filter: *FilterTW
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/CN.svg

  - name: 🇯🇵 日本故障
    <<: *FallBack
    filter: *FilterJP
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/JP.svg

  - name: 🇺🇸 美国故障
    <<: *FallBack
    filter: *FilterUS
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/US.svg

  - name: 🇸🇬 新加坡故障
    <<: *FallBack
    filter: *FilterSG
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/Singapore.svg

  - name: 🇺🇳 联合国故障
    <<: *FallBack
    exclude-filter: *FilterUN
    icon: https://cdn.jsdmirror.com/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/flags/un.svg

  - name: 🇭🇰 香港负载
    <<: *LoadBalance
    filter: *FilterHK
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/HK.svg

  - name: 🇹🇼 台湾负载
    <<: *LoadBalance
    filter: *FilterTW
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/CN.svg

  - name: 🇯🇵 日本负载
    <<: *LoadBalance
    filter: *FilterJP
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/JP.svg

  - name: 🇺🇸 美国负载
    <<: *LoadBalance
    filter: *FilterUS
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/US.svg

  - name: 🇸🇬 新加坡负载
    <<: *LoadBalance
    filter: *FilterSG
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/Singapore.svg

  - name: 🇺🇳 联合国负载
    <<: *LoadBalance
    exclude-filter: *FilterUN
    icon: https://cdn.jsdmirror.com/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/flags/un.svg

