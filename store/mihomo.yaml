    filter: *FilterSG
    <<: *LoadBalance

  - name: 🇺🇳 其它节点-♻️ 自动选择
    icon: https://cdn.jsdmirror.com/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/flags/un.svg
    exclude-filter: *FilterUN
    <<: *UrlTest
  - name: 🇺🇳 其它节点-☁️ 故障转移
    icon: https://cdn.jsdmirror.com/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/flags/un.svg
    exclude-filter: *FilterUN
    <<: *LoadBalance
  - name: 🇺🇳 其它节点-🔮 负载均衡
    icon: https://cdn.jsdmirror.com/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/flags/un.svg
    exclude-filter: *FilterUN
    <<: *LoadBalance

  - name: 🎯 直连访问
    type: url-test
    icon: https://cdn.jsdmirror.com/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/link.svg
    url: https://connectivitycheck.platform.hicloud.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 5000
    max-failed-times: 3
    proxies: [DIRECT]

  - name: 🚫 拦截访问
    type: select
    icon: https://cdn.jsdmirror.com/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/block.svg
    proxies: [REJECT, 🎯 直连访问, 🚀 节点选择]

  - name: 🐟 漏网之鱼
    type: select
    icon: https://cdn.jsdmirror.com/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/fish.svg
    <<: *Select

