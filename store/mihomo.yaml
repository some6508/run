    filter: *FilterUS
    <<: *UrlTest
  - name: 🇺🇸 美国节点-☁️ 故障转移
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/US.svg
    filter: *FilterUS
    <<: *FallBack
  - name: 🇺🇸 美国节点-🔮 负载均衡
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/US.svg
    filter: *FilterUS
    <<: *LoadBalance

  - name: 🇸🇬 新加坡节点-♻️ 自动选择
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/Singapore.svg
    filter: *FilterSG
    <<: *UrlTest
  - name: 🇸🇬 新加坡节点-☁️ 故障转移
