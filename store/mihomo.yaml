  - name: 🇯🇵 日本节点-🔮 负载均衡
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/JP.svg
    filter: *FilterJP
    <<: *LoadBalance

  - name: 🇺🇸 美国节点-♻️ 自动选择
