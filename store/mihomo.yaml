rules:
  - DOMAIN,cdn.jsdmirror.com,🎯 直连访问
  - RULE-SET,private,🎯 直连访问
  - RULE-SET,private_ip,🎯 直连访问,no-resolve
  - RULE-SET,googlefcm,🎯 直连访问
  - RULE-SET,adblockmihomo,🚫 拦截访问
  - AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((OR,((RULE-SET,cn),(RULE-SET,cn_ip,no-resolve)))))),🚫 拦截访问
  - RULE-SET,google,🇬 Google
  - RULE-SET,google_ip,🇬 Google,no-resolve
  - RULE-SET,microsoft,🪟 Microsoft
  - RULE-SET,microsoft_ip,🪟 Microsoft,no-resolve
  - RULE-SET,telegram_ip,✈️ Telegram,no-resolve
  - RULE-SET,telegram,✈️ Telegram
  - RULE-SET,twitter,🐦 Twitter
  - RULE-SET,twitter_ip,🐦 Twitter,no-resolve
  - RULE-SET,tiktok,🎵 TikTok
  - RULE-SET,tiktok_ip,🎵 TikTok,no-resolve
  - RULE-SET,apple,🍎 Apple
  - RULE-SET,apple_ip,🍎 Apple,no-resolve
  - RULE-SET,cn,🎯 直连访问
  - RULE-SET,cn_ip,🎯 直连访问,no-resolve
  - MATCH,🐟 漏网之鱼
