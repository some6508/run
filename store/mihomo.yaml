    filter: *FilterTW
    <<: *UrlTest
  - name: 🇹🇼 台湾节点-☁️ 故障转移
    icon: https://cdn.jsdmirror.com/gh/GitMetaio/Surfing@rm/Home/icon/CN.svg
    filter: *FilterTW
    <<: *FallBack
  - name: 🇹🇼 台湾节点-🔮 负载均衡
