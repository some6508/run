<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- 背景色 -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- 主身体形状 -->
  <path d="M 125 30 
           C 155 85, 215 85, 250 30 
           C 285 150, 315 300, 325 400 
           C 332 450, 295 475, 240 475 
           L 115 475 
           C 60 475, 40 445, 45 400 
           C 60 280, 95 130, 125 30 Z" 
        fill="#4e535c" />

  <!-- 对称的眼睛 (以X=185为中轴线) -->
  <circle cx="140" cy="140" r="24" fill="#ffffff" />
  <circle cx="230" cy="140" r="24" fill="#ffffff" />

  <!-- 对称的腿部/条纹 (以X=185为中轴线) -->
  <!-- 左侧条纹 -->
  <path d="M 105 315 Q 125 375, 160 435" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="20" 
        stroke-linecap="round" />
        
  <!-- 右侧条纹 -->
  <path d="M 265 315 Q 245 375, 210 435" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="20" 
        stroke-linecap="round" />

  <!-- 右上角的圆形（球/卫星） -->
  <circle cx="375" cy="130" r="65" fill="#4e535c" />
  
  <!-- 圆球左侧的小突起 -->
  <path d="M 300 130 
           Q 305 115, 315 115 
           L 315 145 
           Q 305 145, 300 130 Z" 
        fill="#4e535c" />

  <!-- 右下角的月牙形/半环形 -->
  <path d="M 325 270 
           C 380 270, 442 320, 442 388 
           C 442 442, 390 475, 318 475 
           L 345 445 
           C 385 445, 402 415, 402 385 
           C 402 340, 360 312, 325 312 Z" 
        fill="#4e535c" />
        
</svg>